<section class="certs-section" id="certs" data-name="theme/certifications" data-title="Certifications & Global Presence" data-category="theme" data-icon="awards" data-description="International certifications and medallions showcase: MSC, Dolphin Safe, ILO C-188, FISH, ISO 31000, WCPFC, ISSF.">
  <div class="blanz-container">
    <div class="certs-header">
      <h2 class="certs-title" data-bind="sectionEnTitle">CERTIFICATIONS &amp;<br>GLOBAL PRESENCE</h2>
      <span style="font-family: var(--font-serif); font-size: var(--text-lg); font-weight: 400; color: var(--c-subtitle-blue); letter-spacing: 0.15em; display: block; margin-top: 16px;" data-bind="sectionSubtitle">國際合規認證 ‧ 全球合作網絡</span>
    </div>

    <div class="medallion-row reveal-trigger">
      <!-- 01 MSC -->
      <div class="medallion" data-repeater="certifications" data-repeater-item-label="certName" data-label="Certification">
        <div class="medallion-frame">
          <img data-bind="certLogo" src="/wp-content/themes/seaworth/assets/certs/MSC_ecolabel.png" alt="MSC 海洋管理委員會認證" />
        </div>
        <div class="medallion-name" data-bind="certName">MSC<br>海洋管理委員會認證</div>
      </div>

      <!-- 02 Dolphin Safe -->
      <div class="medallion" data-repeater="certifications" data-repeater-item-label="certName" data-label="Certification">
        <div class="medallion-frame">
          <img data-bind="certLogo" src="/wp-content/themes/seaworth/assets/certs/Dolphin_Safe.png" alt="Dolphin Safe 海豚保護標章" />
        </div>
        <div class="medallion-name" data-bind="certName">DOLPHIN SAFE<br>海豚保護標章</div>
      </div>

      <!-- 03 ILO C-188 -->
      <div class="medallion" data-repeater="certifications" data-repeater-item-label="certName" data-label="Certification">
        <div class="medallion-frame">
          <span class="mark-text" data-bind="certMark">ILO</span>
        </div>
        <div class="medallion-name" data-bind="certName">ILO C-188<br>國際勞工公約標準</div>
      </div>

      <!-- 04 FISH -->
      <div class="medallion" data-repeater="certifications" data-repeater-item-label="certName" data-label="Certification">
        <div class="medallion-frame">
          <img data-bind="certLogo" src="/wp-content/themes/seaworth/assets/certs/FISH.jpg" alt="FISH Crew Standard 船員人權標準" />
        </div>
        <div class="medallion-name" data-bind="certName">FISH STANDARD<br>船員人權標準</div>
      </div>

      <!-- 05 ISO 31000:2018 -->
      <div class="medallion" data-repeater="certifications" data-repeater-item-label="certName" data-label="Certification">
        <div class="medallion-frame">
          <span class="mark-text" data-bind="certMark">ISO</span>
        </div>
        <div class="medallion-name" data-bind="certName">ISO 31000:2018<br>風險管理規範</div>
      </div>

      <!-- 06 WCPFC -->
      <div class="medallion" data-repeater="certifications" data-repeater-item-label="certName" data-label="Certification">
        <div class="medallion-frame">
          <img data-bind="certLogo" src="/wp-content/themes/seaworth/assets/certs/WCPFC-logo.png" alt="WCPFC 中西太平洋漁業委員會" />
        </div>
        <div class="medallion-name" data-bind="certName">WCPFC<br>中西太平洋漁業<br>委員會</div>
      </div>

      <!-- 07 ISSF -->
      <div class="medallion" data-repeater="certifications" data-repeater-item-label="certName" data-label="Certification">
        <div class="medallion-frame">
          <img data-bind="certLogo" src="/wp-content/themes/seaworth/assets/certs/ISSF-LOGO.png" alt="ISSF 國際永續漁業基金會" />
        </div>
        <div class="medallion-name" data-bind="certName">ISSF<br>國際永續漁業基金會</div>
      </div>
    </div>
  </div>
</section>
