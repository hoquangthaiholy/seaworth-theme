<section class="blanz-section sp-section"

    data-description="Careers call to action panel with headline, description, and link button">

    <inspector-controls>

            <link-control label="Button link / 按鈕連結" data-bind="btnLink"></link-control>

    </inspector-controls>

    <div class="blanz-container">
        <div class="sp-cta-panel reveal">

            <a href="#" class="sp-cta-btn" data-bind="btnLink">前往人力銀行招募頁面 <i data-lucide="arrow-right" style="width:14px; height:14px;"></i></a>
        </div>
    </div>
</section>
