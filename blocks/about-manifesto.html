<section class="blanz-section about-manifesto-section" style="padding: 40px 0; position: relative; z-index: 1;" data-name="theme/about-manifesto" data-title="About - Deep Ocean Manifesto" data-category="theme" data-icon="book" data-description="Deep ocean full-width section with parallax vessel image and detailed corporate mission statement.">
  <!-- 全滿版深色背景色塊 -->
  <div class="reveal" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: var(--c-ocean-deep); z-index: -1;"></div>

  <div class="blanz-container" style="max-width: 1300px; position: relative; z-index: 2;">
    <div class="about-manifesto-flex" style="display: flex; flex-wrap: wrap; align-items: flex-start;">
      <!-- 左側圖片 -->
      <div class="reveal about-manifesto-img" style="flex: 1;">
        <div class="parallax-wrap" style="width: 100%; transition: transform 0.1s cubic-bezier(0.25, 0.46, 0.45, 0.94);">
          <img data-bind="manifestoImage" src="/wp-content/themes/seaworth/assets/photo/about-manifesto-photo.jpg" alt="關於海沃" style="width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 4px;" />
        </div>
      </div>

      <!-- 右側文字 -->
      <div class="about-manifesto-text" style="flex: 1.5; padding-top: 20px;">
        <div class="sp-intro" style="max-width: 800px;">
          <p class="reveal" data-repeater="paragraphs" data-label="Paragraph" data-repeater-item-label="text" data-bind="text" data-bind-control="textarea" style="color: rgba(255, 255, 255, 0.85); font-size: var(--text-base); text-align: justify;">歷經逾四十載的砥礪深耕，海沃控股蛻變為涵蓋智慧造船、遠洋漁撈、冷鏈物流及國際貿易的多元控股公司。我們堅持「專業、誠信、創新、永續」的核心價值，優化企業內控與合規治理，全面引領產業轉型升級。</p>
          <p class="reveal" data-repeater="paragraphs" data-label="Paragraph" data-repeater-item-label="text" data-bind="text" data-bind-control="textarea" style="color: rgba(255, 255, 255, 0.85); font-size: var(--text-base); text-align: justify;">迎向全球漁業資源與環境永續的新局，海沃積極推動數位化船隊管理，落實 FISH、MSC 等國際永續認證與漁業組織規範；同時率先導入海上遠距醫療機制，以具體行動守護船員人權與職業安全。</p>
          <p class="reveal" data-repeater="paragraphs" data-label="Paragraph" data-repeater-item-label="text" data-bind="text" data-bind-control="textarea" style="color: rgba(255, 255, 255, 0.85); font-size: var(--text-base); text-align: justify;">從海洋出發，也對海洋負責。海沃控股將持續提供安全、優質且全流程可追溯的優良漁獲，攜手全球夥伴，共同推動更具責任與韌性的現代遠洋漁業。朝向「敬海而行、與世界共榮共善」的永續願景穩健邁進。</p>
        </div>
      </div>
    </div>
  </div>
</section>
