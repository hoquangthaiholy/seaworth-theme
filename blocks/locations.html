<section class="blanz-section sp-section"
    data-name="theme/locations"
    data-title="Global Locations Grid"
    data-category="theme"
    data-icon="location"
    data-description="Global offices and headquarters location cards grid">

    <div class="blanz-container">
        <div class="sp-lede reveal" data-bind="lede">海沃控股全球營運據點</div>

        <div class="sp-location-grid">
            <div class="sp-location-card reveal" data-repeater="locations" data-repeater-item-label="name" data-label="Location 01">
                <span class="sp-location-tag" data-bind="tag">HEADQUARTERS</span>
                <h3 data-bind="name">台灣營運總部（高雄）</h3>
                <p data-bind="desc" data-bind-control="textarea">海沃控股營運核心，統籌全球船隊調度與國際貿易業務。</p>
            </div>

            <div class="sp-location-card reveal" data-repeater="locations" data-repeater-item-label="name" data-label="Location 02">
                <span class="sp-location-tag" data-bind="tag">BRANCH OFFICE</span>
                <h3 data-bind="name">韓國辦事處（釜山）</h3>
                <p data-bind="desc" data-bind-control="textarea">北亞區域營運據點，強化東北亞供應鏈合作。</p>
            </div>

            <div class="sp-location-card reveal" data-repeater="locations" data-repeater-item-label="name" data-label="Location 03">
                <span class="sp-location-tag" data-bind="tag">BRANCH OFFICE</span>
                <h3 data-bind="name">中國辦事處（舟山）</h3>
                <p data-bind="desc" data-bind-control="textarea">深化中國市場布局與冷鏈物流合作網絡。</p>
            </div>

            <div class="sp-location-card reveal" data-repeater="locations" data-repeater-item-label="name" data-label="Location 04">
                <span class="sp-location-tag" data-bind="tag">BRANCH OFFICE</span>
                <h3 data-bind="name">泰國辦事處（曼谷）</h3>
                <p data-bind="desc" data-bind-control="textarea">東南亞戰略據點，串聯區域經銷與貿易夥伴。</p>
            </div>

            <div class="sp-location-card reveal" data-repeater="locations" data-repeater-item-label="name" data-label="Location 05">
                <span class="sp-location-tag" data-bind="tag">BRANCH OFFICE</span>
                <h3 data-bind="name">巴布亞紐幾內亞辦事處</h3>
                <p data-bind="desc" data-bind-control="textarea">鞏固核心漁業資源，深化與 PNA 國家之策略合作。</p>
            </div>
        </div>
    </div>
</section>
