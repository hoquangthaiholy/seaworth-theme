<div class="blanz-container" style="padding-bottom: 60px;" data-name="theme/crosslinks" data-title="Crosslink Navigation" data-category="theme" data-icon="leftright" data-description="Subpage bottom navigation row with previous and next crosslinks.">
  <inspector-controls>
    <panel-body title="Navigation Links">
      <link-control data-bind="prevLink" label="Previous Page Link (上一頁)"></link-control>
      <link-control data-bind="nextLink" label="Next Page Link (下一頁)"></link-control>
    </panel-body>
  </inspector-controls>

  <div class="sp-crosslink-row reveal">
    <a href="#" data-bind="prevLink">← 上一頁</a>
    <a href="#" data-bind="nextLink">下一頁 →</a>
  </div>
</div>
