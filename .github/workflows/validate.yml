name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Lint PHP
        run: |
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Validate theme.json
        run: jq empty theme.json

      - name: Check theme headers
        run: |
          VERSION=$(sed -n 's/^Version: *//p' style.css | head -1 | tr -d '\r')
          echo "Version: $VERSION"
          echo "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){1,3}$' || { echo "::error::style.css has no valid Version header"; exit 1; }
          grep -q '^Theme Name: Seaworth' style.css || { echo "::error::style.css Theme Name is missing"; exit 1; }
